<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Iain Hoggan</title>
<desc id="d">Network technician. Simulation in Python, local AI on rescued hardware. An animated neural network passes signals left to right while a training curve settles.</desc>
<style>
:root{--panel:#E4E6E1;--bezel:#B7BCB4;--ink:#17202B;--ink2:#57616E;--ink3:#8A929C;--screen:#0F181E;--screen2:#16232B;--trace:#57C79A;--lamp:#E0982B;--edge:#3C5A55}
@media (prefers-color-scheme:dark){:root{--panel:#161B22;--bezel:#30363D;--ink:#E6EDF3;--ink2:#9DA7B3;--ink3:#6E7681;--screen:#0B1116;--screen2:#101A21}}
.bg{fill:var(--panel)}
.name{font:800 64px "Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.02em;fill:var(--ink)}
.kick{font:600 15px "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.22em;fill:var(--ink3)}
.sub{font:400 21px "Source Serif 4",Georgia,"Times New Roman",serif;fill:var(--ink2)}
.mono{font:500 13px "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:var(--trace)}
.dim{fill:#5E7C74}
.lampt{fill:var(--lamp)}
.scr{fill:var(--screen);stroke:var(--bezel);stroke-width:3}
.grid{stroke:#1E2E36;stroke-width:1}
.e{stroke:var(--edge);stroke-width:1.2}
.n{fill:var(--screen2);stroke:#4F8F7A;stroke-width:1.6}
.g{fill:var(--trace);opacity:0;animation:glow 4.2s ease-in-out infinite}
.p{fill:none;stroke:var(--trace);stroke-width:3;stroke-linecap:round;animation:run 5.6s linear infinite;filter:url(#bl)}
.curve{fill:none;stroke:var(--lamp);stroke-width:2;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 7s ease-out infinite}
.cur{animation:blink 1.1s steps(1) infinite}
.led{fill:var(--trace);animation:blink 2.4s steps(1) infinite}
@keyframes run{0%{stroke-dashoffset:14;opacity:0}6%{opacity:1}55%{opacity:1}62%,100%{stroke-dashoffset:var(--len);opacity:0}}
@keyframes glow{0%,100%{opacity:0}45%{opacity:.9}60%{opacity:0}}
@keyframes draw{0%{stroke-dashoffset:900}70%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.p,.g,.curve,.cur,.led{animation:none}.curve{stroke-dashoffset:0}.p{opacity:0}}
</style>
<defs><filter id="bl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>
<clipPath id="sc"><rect x="640" y="34" width="520" height="232" rx="10"/></clipPath></defs>
<rect class="bg" width="1200" height="300" rx="14"/>
<text class="kick" x="48" y="82">NETWORK · SIMULATION · LOCAL AI</text>
<text class="name" x="44" y="152">IAIN HOGGAN</text>
<text class="sub" x="48" y="196">I build things on hardware other people throw away,</text>
<text class="sub" x="48" y="226">and I measure them, even when the numbers say I'm wrong.</text>
